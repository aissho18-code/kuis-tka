<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan TKA Matematika SD/MI – Soal Bergambar &amp; Pilihan Ganda Kompleks</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7f6;--card:#fff;--tx:#1d2b29;--mu:#5d6d6a;--bd:#d6dedc;--pr:#00857c;--ok:#1a7f45;--okb:#e5f6ec;--no:#b3261e;--nob:#fdeceb;--em:#8a6d00;--emb:#fff6d6;--bt:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1b2523;--tx:#e7efed;--mu:#9fb0ac;--bd:#33423f;--pr:#3cc4b8;--ok:#5fd68f;--okb:#17301f;--no:#ff8a80;--nob:#3a1d1b;--em:#f0cf5a;--emb:#38300f;--bt:#0b1412}}
:root[data-theme="dark"]{--bg:#121917;--card:#1b2523;--tx:#e7efed;--mu:#9fb0ac;--bd:#33423f;--pr:#3cc4b8;--ok:#5fd68f;--okb:#17301f;--no:#ff8a80;--nob:#3a1d1b;--em:#f0cf5a;--emb:#38300f;--bt:#0b1412}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:1.3rem;margin:.2rem 0}.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
.q p{margin:.2rem 0 .6rem;font-weight:600}.q svg{color:var(--tx);display:block;margin:6px 0 10px}
label{display:block;padding:9px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
label:has(input:checked){border-color:var(--pr);background:var(--bg)}label input{margin-right:8px}
.st{border-top:1px solid var(--bd);padding:8px 0}.st div{display:flex;gap:8px}.st label{flex:1;margin:4px 0;text-align:center}
table{border-collapse:collapse;margin:6px 0 10px}td,th{border:1px solid var(--bd);padding:4px 12px;text-align:center}
button{background:var(--pr);color:var(--bt);border:0;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:600;cursor:pointer;width:100%}
button.sec{background:transparent;color:var(--pr);border:1px solid var(--pr);margin-top:8px}
.q.ok{border-color:var(--ok);background:var(--okb)}.q.no{border-color:var(--no);background:var(--nob)}.q.em{border-color:var(--em);background:var(--emb)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:99px}.ok .tag{color:var(--ok)}.no .tag{color:var(--no)}.em .tag{color:var(--em)}
.fb{margin-top:8px;font-size:.95rem}.fb b{color:var(--ok)}.bad{color:var(--no)}.good{color:var(--ok)}
.big{font-size:2rem;font-weight:800;color:var(--pr)}.sum{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sum span{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:.9rem}
</style></head><body><main>
<h1>Latihan TKA Matematika SD/MI</h1>
<div class="mu">20 soal · soal bergambar &amp; pilihan ganda kompleks · Benar +4 · Salah −1 · Kosong 0</div>
<div class="card"><div class="mu">Petunjuk: pada soal “tentukan Benar atau Salah”, semua pernyataan harus benar agar soal bernilai +4.</div>
<label style="border:0;padding:6px 0 0;cursor:default" for="nm">Nama kamu</label><input type="text" id="nm" placeholder="Tulis namamu di sini" autocomplete="name"></div>
<div id="qs"></div><button id="fin">Selesai &amp; Lihat Hasil</button><div id="res"></div></main>
<script>
const P=(a,b,r)=>[b*Math.sin(a*Math.PI/180)*r+50,50-Math.cos(a*Math.PI/180)*r*b].map(x=>x.toFixed(1));
const clock=(h,m)=>{let n="";for(let i=1;i<=12;i++){const[x,y]=P(i*30,1,37);n+=`<text x="${x}" y="${(+y+3.5)}" font-size="9" text-anchor="middle" fill="currentColor">${i}</text>`}
const hm=P((h%12)*30+m/2,1,24),mm=P(m*6,1,35);
return `<svg viewBox="0 0 100 100" width="110"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"/>${n}<line x1="50" y1="50" x2="${hm[0]}" y2="${hm[1]}" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><line x1="50" y1="50" x2="${mm[0]}" y2="${mm[1]}" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="50" cy="50" r="2.5" fill="currentColor"/></svg>`};
const bar=(d,mx)=>{const bw=286/d.length;let s=`<svg viewBox="0 0 320 175" width="100%" style="max-width:360px">`;
for(let i=0;i<5;i++){const y=140-i*30;s+=`<line x1="32" x2="316" y1="${y}" y2="${y}" stroke="currentColor" opacity=".2"/><text x="28" y="${y+3}" font-size="10" text-anchor="end" fill="currentColor">${i*mx/4}</text>`}
d.forEach((x,i)=>{const h=x[1]/mx*120,cx=32+i*bw+bw*.2;s+=`<rect x="${cx}" y="${140-h}" width="${bw*.6}" height="${h}" fill="var(--pr)"/><text x="${cx+bw*.3}" y="156" font-size="10" text-anchor="middle" fill="currentColor">${x[0]}</text>`});return s+"</svg>"};
const Lb=`<svg viewBox="0 0 240 185" width="240"><polygon points="30,20 114,20 114,76 198,76 198,160 30,160" fill="var(--pr)" fill-opacity=".18" stroke="currentColor" stroke-width="2"/><g font-size="11" fill="currentColor" text-anchor="middle"><text x="72" y="14">6 cm</text><text x="124" y="52" text-anchor="start">4 cm</text><text x="156" y="70">6 cm</text><text x="114" y="177">12 cm</text><text x="26" y="94" text-anchor="end">10 cm</text></g></svg>`;
const trap=`<svg viewBox="0 0 200 150" width="210"><polygon points="30,125 170,125 142,35 58,35" fill="var(--pr)" fill-opacity=".18" stroke="currentColor" stroke-width="2"/><line x1="100" y1="35" x2="100" y2="125" stroke="currentColor" stroke-dasharray="4"/><g font-size="11" fill="currentColor" text-anchor="middle"><text x="100" y="28">6 cm</text><text x="100" y="141">10 cm</text><text x="118" y="85" text-anchor="start">5 cm</text></g></svg>`;
const tb=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")}</table>`;
const D=[
{t:"m",q:"Diagram batang berikut menunjukkan banyak porsi bakso yang terjual selama 5 hari. Berapa selisih penjualan tertinggi dan terendah?",i:bar([["Sen",20],["Sel",35],["Rab",25],["Kam",40],["Jum",30]],40),o:["25 porsi","20 porsi","15 porsi","10 porsi"],a:1,e:"Tertinggi 40 (Kamis), terendah 20 (Senin). Selisih = 40 − 20 = 20 porsi."},
{t:"b",q:"Diagram batang menunjukkan banyak pengunjung perpustakaan. Tentukan Benar atau Salah setiap pernyataan.",i:bar([["Sen",15],["Sel",25],["Rab",20],["Kam",30]],40),s:[["Rata-rata pengunjung per hari adalah 25 orang.",0],["Jumlah pengunjung selama 4 hari adalah 90 orang.",1],["Pengunjung terbanyak terjadi pada hari Kamis.",1]],e:"Total = 15+25+20+30 = 90. Rata-rata = 90 : 4 = 22,5 (bukan 25). Batang tertinggi adalah Kamis (30)."},
{t:"m",q:"Dewi mulai membaca pada jam kiri dan selesai pada jam kanan (pagi hari, sebelum tengah hari). Berapa lama Dewi membaca?",i:`<div style="display:flex;gap:16px">${clock(8,20)}${clock(11,5)}</div>`,o:["2 jam 35 menit","2 jam 45 menit","3 jam 5 menit","3 jam 15 menit"],a:1,e:"Jam kiri 08.20, jam kanan 11.05. Dari 08.20 ke 11.00 = 2 jam 40 menit, ditambah 5 menit = 2 jam 45 menit."},
{t:"b",q:"Ibu punya 24 roti dan 36 kotak susu, akan dibuat paket yang isinya sama tanpa sisa. Tentukan Benar atau Salah.",s:[["Paket dapat dibuat sebanyak 8.",0],["Paket terbanyak yang dapat dibuat adalah 12.",1],["Jika dibuat 12 paket, setiap paket berisi 2 roti dan 3 kotak susu.",1]],e:"Banyak paket harus faktor persekutuan 24 dan 36; FPB = 12. 8 bukan faktor 36 (36 : 8 = 4,5). Dengan 12 paket: 24:12 = 2 roti, 36:12 = 3 susu."},
{t:"m",q:"Dari sebuah pita, 2/5 bagian dipakai untuk kado dan 1/4 bagian untuk hiasan. Sisa pita adalah … bagian.",o:["13/20","3/20","3/9","7/20"],a:3,e:"2/5 = 8/20 dan 1/4 = 5/20. Terpakai 13/20. Sisa = 20/20 − 13/20 = 7/20."},
{t:"b",q:"Perhatikan daftar harga. Tentukan Benar atau Salah.",i:tb(["Barang","Harga"],[["Pensil","Rp2.500"],["Buku","Rp4.000"],["Penghapus","Rp1.500"]]),s:[["5 pensil dan 3 penghapus cukup dibayar dengan Rp15.000.",0],["3 pensil dan 2 buku harganya Rp15.500.",1],["Dengan Rp20.000, membeli 4 buku dan 2 penghapus mendapat kembalian Rp1.000.",1]],e:"5 pensil + 3 penghapus = 12.500 + 4.500 = 17.000 (lebih dari 15.000). 3 pensil + 2 buku = 7.500 + 8.000 = 15.500. 4 buku + 2 penghapus = 16.000 + 3.000 = 19.000; kembalian 1.000."},
{t:"m",q:"Berapa keliling bangun berikut? (sisi kanan bawah tidak diberi ukuran, hitung sendiri)",i:Lb,o:["36 cm","40 cm","44 cm","48 cm"],a:2,e:"Sisi kanan = 10 − 4 = 6 cm. Keliling = 6 + 4 + 6 + 6 + 12 + 10 = 44 cm (sama dengan keliling persegi panjang 12 × 10)."},
{t:"b",q:"Perhatikan bangun yang sama (persegi panjang 12 cm × 10 cm dipotong pojoknya 6 cm × 4 cm). Tentukan Benar atau Salah.",i:Lb,s:[["Luas bangun 108 cm².",0],["Luas bangun 96 cm².",1],["Luas bagian yang dipotong 24 cm².",1]],e:"Persegi panjang utuh = 12 × 10 = 120 cm². Bagian terpotong = 6 × 4 = 24 cm². Luas bangun = 120 − 24 = 96 cm²."},
{t:"b",q:"Sebuah bak mandi berbentuk balok berukuran 80 cm × 50 cm × 40 cm. Tentukan Benar atau Salah.",s:[["Untuk memenuhi bak dibutuhkan 200 liter air.",0],["Volume bak adalah 160 liter.",1],["Jika terisi 3/4 bagian, banyak air 120 liter.",1]],e:"Volume = 80 × 50 × 40 = 160.000 cm³ = 160 liter (1 liter = 1.000 cm³). 3/4 × 160 = 120 liter."},
{t:"m",q:"Besar sudut terkecil yang dibentuk jarum jam pada gambar adalah …",i:clock(4,0),o:["60°","90°","120°","150°"],a:2,e:"Jam 4.00: jarum menunjuk angka 12 dan 4. Antar angka = 30°, sehingga 4 × 30° = 120°."},
{t:"m",q:"Sebuah sepeda melaju dengan kecepatan 18 km/jam. Waktu yang diperlukan untuk menempuh 45 km adalah …",o:["2 jam","2 jam 30 menit","3 jam","2 jam 50 menit"],a:1,e:"Waktu = jarak : kecepatan = 45 : 18 = 2,5 jam = 2 jam 30 menit."},
{t:"b",q:"Tentukan Benar atau Salah hubungan satuan berikut.",s:[["1,5 jam = 150 menit.",0],["3,5 kg = 3.500 gram.",1],["2.400 ml = 2,4 liter.",1]],e:"1,5 jam = 1,5 × 60 = 90 menit. 3,5 × 1.000 = 3.500 g. 2.400 : 1.000 = 2,4 liter."},
{t:"m",q:"Tabel menunjukkan nilai 30 siswa. Banyak siswa yang mendapat nilai 8 ke atas adalah …",i:tb(["Nilai","5","6","7","8","9"],[["Siswa","3","7","10","6","4"]]),o:["4","6","10","16"],a:2,e:"Nilai 8 ke atas berarti nilai 8 dan 9: 6 + 4 = 10 siswa."},
{t:"b",q:"Tentukan Benar atau Salah hubungan bentuk pecahan berikut.",s:[["3/8 = 0,25.",0],["0,6 = 3/5.",1],["25% = 1/4.",1]],e:"3/8 = 3 : 8 = 0,375 (bukan 0,25). 0,6 = 6/10 = 3/5. 25% = 25/100 = 1/4."},
{t:"m",q:"Hasil dari 1.500 + 24 × 25 − 400 adalah …",o:["1.100","1.700","2.300","2.900"],a:1,e:"Kerjakan perkalian dahulu: 24 × 25 = 600. Lalu 1.500 + 600 − 400 = 1.700."},
{t:"m",q:"Ayah membuat 2,4 liter jus dan menuangkannya ke gelas-gelas berukuran 300 ml. Banyak gelas yang terisi penuh adalah …",o:["6 gelas","8 gelas","10 gelas","12 gelas"],a:1,e:"2,4 liter = 2.400 ml. Banyak gelas = 2.400 : 300 = 8."},
{t:"b",q:"Sebuah kubus memiliki panjang rusuk 5 cm. Tentukan Benar atau Salah.",s:[["Kubus memiliki 8 rusuk.",0],["Volume kubus 125 cm³.",1],["Luas seluruh permukaan kubus 150 cm².",1]],e:"Kubus punya 12 rusuk (8 adalah banyak titik sudut). Volume = 5³ = 125. Luas permukaan = 6 × 5 × 5 = 150 cm²."},
{t:"m",q:"Berapa luas trapesium berikut?",i:trap,o:["80 cm²","30 cm²","60 cm²","40 cm²"],a:3,e:"Luas trapesium = ½ × (sisi sejajar atas + bawah) × tinggi = ½ × (6 + 10) × 5 = 40 cm²."},
{t:"m",q:"Lahan persegi panjang berukuran 25 m × 16 m akan dipagari. Tiang dipasang setiap jarak 2 m. Banyak tiang yang dibutuhkan adalah …",o:["20","41","82","40"],a:1,e:"Keliling = 2 × (25 + 16) = 82 m. Banyak tiang = 82 : 2 = 41."},
{t:"b",q:"Tentukan Benar atau Salah.",s:[["Mobil 36 km/jam selama 2 jam menempuh 62 km.",0],["Andi berangkat pukul 06.45 dan perjalanan 35 menit, ia tiba pukul 07.20.",1],["Jarak 12 km ditempuh dengan kecepatan 24 km/jam, waktunya 30 menit.",1]],e:"36 × 2 = 72 km (bukan 62). 06.45 + 35 menit = 07.20. 12 : 24 = 0,5 jam = 30 menit."}
];
const L="ABCD",qs=document.getElementById("qs"),res=document.getElementById("res"),fin=document.getElementById("fin"),$=s=>document.querySelector(s);
function build(){qs.innerHTML=D.map((d,i)=>`<div class="card q" id="q${i}"><p>${i+1}. ${d.q}</p>${d.i||""}`+(d.t=="m"?d.o.map((t,j)=>`<label><input type="radio" name="r${i}" value="${j}">${L[j]}. ${t}</label>`).join(""):d.s.map((s,j)=>`<div class="st"><div>${s[0]}</div><div><label><input type="radio" name="b${i}_${j}" value="1">Benar</label><label><input type="radio" name="b${i}_${j}" value="0">Salah</label></div></div>`).join(""))+`<div class="fb"></div></div>`).join("");res.innerHTML="";fin.style.display="";window.scrollTo(0,0)}
fin.onclick=()=>{
const ans=D.map((d,i)=>d.t=="m"?[$(`input[name=r${i}]:checked`)]:d.s.map((_,j)=>$(`input[name=b${i}_${j}]:checked`)));
const un=ans.filter(v=>!v.some(x=>x)).length;
if(un&&!confirm(un+" soal belum dijawab (skor 0). Tetap selesai?"))return;
let b=0,s=0,k=0;
D.forEach((d,i)=>{const v=ans[i],box=$("#q"+i),fb=box.querySelector(".fb");box.querySelectorAll("input").forEach(x=>x.disabled=true);
let any=v.some(x=>x),ok,h;
if(d.t=="m"){ok=any&&+v[0].value===d.a;h=(ok?"":`Jawabanmu: ${any?L[+v[0].value]+". "+d.o[+v[0].value]:"belum dijawab"}<br>`)+`Jawaban benar: <b>${L[d.a]}. ${d.o[d.a]}</b>`}
else{ok=any&&v.every((x,j)=>x&&(x.value=="1")===!!d.s[j][1]);h=d.s.map((x,j)=>{const g=v[j]?(v[j].value=="1"):null,c=g===!!x[1];return `<div class="${c?"good":"bad"}">${c?"✔":"✘"} ${x[0]} → ${x[1]?"Benar":"Salah"}${c?"":(g===null?" (belum dijawab)":` (jawabanmu: ${g?"Benar":"Salah"})`)}</div>`}).join("")}
const cls=!any?"em":ok?"ok":"no";if(!any)k++;else if(ok)b++;else s++;
box.classList.add(cls);box.insertAdjacentHTML("afterbegin",`<span class="tag">${{em:"Kosong (0)",ok:"Benar (+4)",no:"Salah (−1)"}[cls]}</span>`);
fb.innerHTML=h+`<br><span class="mu">Pembahasan: ${d.e}</span>`});
const sk=b*4-s,nl=Math.max(0,Math.round(sk/80*100)),nm=$("#nm").value.trim().replace(/[<>&]/g,"");
res.innerHTML=`<div class="card"><div class="mu">Hasil${nm?" · "+nm:""}</div><div class="big">${nl} / 100</div><div>Skor: ${sk} dari 80</div><div class="sum"><span>✔ Benar: ${b}</span><span>✘ Salah: ${s}</span><span>○ Kosong: ${k}</span></div><div class="mu" style="margin-top:8px">Gulir ke atas untuk melihat soal yang salah (merah) beserta pembetulannya.</div><button class="sec" id="rs">Ulangi Latihan</button></div>`;
fin.style.display="none";$("#rs").onclick=build;window.scrollTo({top:0,behavior:"smooth"})};
build();
</script></body></html>
